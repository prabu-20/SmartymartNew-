{% extends 'base.html' %}
{% block content %}
<section class="py-5 text-center container" style="margin-top:10px;">
   
</section>
<section class="bg-light py-4 my-2">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h4 class="mb-2">Categories</h4>
                <hr style="border-color:#b8bfc2">
            </div>

            {% for item in category %}
            <div class="col-md-4 col-lg-3">
                <div class="card my-3">
                    <a href="{% url 'collectionsview' item.name %}" style="text-decoration: none;">
                    <img src="{{item.image.url}}" class="card-image-top" alt="Categories" style="width:250px;">
                    
                    <div class="card-body">
                        <h5 class="card-title text-primary">{{item.name}}</h5>
                        <p class="card-terxt">{{item.description}}</p>
                    </div>
                    </a>
                </div>
            </div>
            {% endfor %}

        </div>
    </div>
</section>
{% endblock %}

{% load static %}
<head>

  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <style>
    .voice-search-container {
  display: flex;
  align-items: center;
  margin-left: 20px;
}

.voice-search-container input {
  padding: 6px 10px;
  border-radius: 20px;
  border: 1px solid #ccc;
  outline: none;
}

.mic-btn {
  margin-left: 8px;
  border: none;
  background: #28a745;
  color: white;
  padding: 6px 10px;
  border-radius: 50%;
  cursor: pointer;
}

.mic-btn:hover {
  background: #218838;
}
  </style>
</head>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}"><i class="fa fa-cart-plus"></i> SmartyMart</a>

    <div class="voice-search-container">
      <input type="text" id="searchInput" placeholder="Search products..." />
      <button type="button" onclick="handleSearch()">🔍</button>
      <button onclick="startListening()" class="mic-btn">🎤</button>
    </div>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse " id="navbarNavAltMarkup"  >
      <div class="navbar-nav ms-auto">
        <a class="nav-link" aria-current="page" href="{% url 'home' %}"><i class="fa fa-home"></i> Home</a>
        {% if request.user.is_authenticated %}
          <a class="nav-link" aria-current="page" href="#"><i class="fa fa-user"></i> {{request.user}}</a>
          <a class="nav-link" aria-current="page" href="{% url 'logout' %}"><i class="fa fa-sign-out"></i> Logout</a>
        {% else %}
          <a class="nav-link" aria-current="page" href="{% url 'login' %}"><i class="fa fa-sign-in"></i> Login</a>
          <a class="nav-link" aria-current="page" href="{% url 'register' %}"><i class="fa fa-users"></i> Register</a>
        {% endif %}
          <a class="nav-link" aria-current="page" href="{% url 'collections' %}"><i class="fa fa-cubes"></i> Collections</a>
          <a class="nav-link" aria-current="page" href="{% url 'add_cart' %}"><i class="fa fa-shopping-cart"></i> Add Cart</a>
          <a class="nav-link" aria-current="page" href="{% url 'wish_list' %}"><i class="fa fa-heart"></i> Wish List</a>
   
      </div>
     
    </div>
  </div>
</nav>

<script>
function startListening() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice search not supported in this browser");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";

  recognition.start();

  recognition.onresult = function(event) {
    const transcript = event.results[0][0].transcript;
    document.getElementById("searchInput").value = transcript;

    // STOP COMMAND
  if (transcript.includes("stop") || transcript.includes("cancel")) {
    recognition.stop();
    console.log("Voice stopped by user command");

  //  Clear search bar
    document.getElementById("searchInput").value = "";

  //  Reset all products (show everything)
    filterProducts("");

  return;
}

    // Optional: auto-submit search
    console.log("User said:", transcript);
  };

  recognition.onerror = function(event) {
    console.error(event.error);
  };
}
</script>
<script>
function handleSearch() {
  const query = document.getElementById("searchInput").value;

  if (query.trim() !== "") {
    window.location.href = "/search/?q=" + encodeURIComponent(query);
  }
}
</script>
